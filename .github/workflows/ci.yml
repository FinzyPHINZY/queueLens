name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - name: Build Docker image
        run: docker build -t queuelens-preview .
      - name: Smoke Docker image
        run: |
          docker run -d --name queuelens-preview --network host \
            -e REDIS_URL=redis://127.0.0.1:6379 \
            -e MONITOR_HOST=127.0.0.1 \
            -e MONITOR_TOKEN=ci-only-token \
            queuelens-preview
          trap 'docker rm -f queuelens-preview' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:3000/api/v1/health
          curl -fsS -H 'Authorization: Bearer ci-only-token' http://127.0.0.1:3000/api/v1/queues | rg 'demo'
          curl -fsS http://127.0.0.1:3000/ | rg 'assets'
      - name: Baseline benchmark
        run: pnpm benchmark
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
