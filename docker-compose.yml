services:
  redis:
    image: redis:8.2-alpine
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 20

  worker:
    build: .
    command: ['node', 'dist/apps/example-bullmq/src/worker.js']
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  seed:
    build: .
    command: ['node', 'dist/apps/example-bullmq/src/seed.js']
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  monitor:
    build: .
    environment:
      REDIS_URL: redis://redis:6379
      MONITOR_HOST: 0.0.0.0
      MONITOR_QUEUES: demo
      MONITOR_TOKEN: ${MONITOR_TOKEN:?Set MONITOR_TOKEN}
      MONITOR_SHOW_FAILURE_DETAILS: 'true'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
